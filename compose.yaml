services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      TRACE_OLLAMA_URL: http://ollama:11434
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    depends_on: [ollama]
    cpus: 2
    mem_limit: 3g
    volumes:
      - trace-data:/data
      - trace-model:/model-cache
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes: ["trace-ollama:/root/.ollama"]
    cpus: 2
    mem_limit: 8g
    restart: unless-stopped
volumes:
  trace-ollama:
  trace-data:
  trace-model:
